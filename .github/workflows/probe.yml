# Temporary: decompiles Minecraft and prints the code the mixins target. (v4)
name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew genSources --no-configuration-cache -q
      - name: dump
        run: |
          J=$(find ~/.gradle $PWD/.gradle -name 'minecraft-*sources.jar' 2>/dev/null | head -5); echo "$J"
          mkdir src_mc && for j in $J; do (cd src_mc && unzip -oq "$j"); done
          cd src_mc
          show() { echo "=================== $1 :: $2"; grep -n -E -C ${3:-4} "$2" "$1" || echo "NO MATCH"; }
          for f in net/minecraft/server/level/ChunkTaskPriorityQueue.java net/minecraft/server/level/ChunkTaskDispatcher.java net/minecraft/server/level/ThrottlingChunkTaskDispatcher.java net/minecraft/server/level/ChunkTracker.java; do echo "=================== $f"; cat -n $f | grep -v "^\s*[0-9]*\s*import"; done
          echo "=================== DistanceManager"; cat -n net/minecraft/server/level/DistanceManager.java | sed -n '/class FixedPlayerDistanceChunkTracker/,$p'
