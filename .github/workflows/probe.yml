# Temporary: prints worldgen signatures used by the fast LOD terrain sampler.
name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew genSources --no-configuration-cache -q
      - name: dump
        run: |
          mkdir src_mc
          for j in $(find $PWD/.gradle ~/.gradle -name 'minecraft-*sources.jar' 2>/dev/null); do (cd src_mc && unzip -oq "$j"); done
          cd src_mc/net/minecraft/world/level/levelgen
          echo "##### NoiseRouter"; grep -nE 'record NoiseRouter|DensityFunction [a-zA-Z]+[,)]' NoiseRouter.java | head -30
          echo "##### SinglePointContext"; grep -nE 'record SinglePointContext|interface FunctionContext|getBlender' DensityFunction.java | head
          echo "##### iterateNoiseColumn"; grep -n -A45 'private OptionalInt iterateNoiseColumn' NoiseBasedChunkGenerator.java | cut -c1-180 | head -60
          echo "##### preliminary"; grep -rn 'preliminarySurfaceLevel' --include=*.java . | cut -c1-200 | head -20
          echo "##### NoiseSettings"; grep -nE 'record NoiseSettings|public int (getCellHeight|getCellWidth)|minY|height' NoiseSettings.java | head
          echo "##### generatorSettings"; grep -nE 'public Holder<NoiseGeneratorSettings> generatorSettings|NoiseGeneratorSettings' NoiseBasedChunkGenerator.java | head -5
          grep -nE 'NoiseSettings noiseSettings|int seaLevel|public NoiseSettings|record NoiseGeneratorSettings' NoiseGeneratorSettings.java | head
