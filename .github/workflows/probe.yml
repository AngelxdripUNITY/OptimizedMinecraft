# Temporary: prints lightmap / block model / sprite signatures for LOD lighting and colours.
name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew genSources --no-configuration-cache -q
      - name: dump
        run: |
          mkdir src_mc
          for j in $(find $PWD/.gradle ~/.gradle -name 'minecraft-*sources.jar' 2>/dev/null); do (cd src_mc && unzip -oq "$j"); done
          CJ=$(find ~/.gradle -name 'minecraft-client.jar' | head -1)
          (cd src_mc && unzip -oq "$CJ" 'assets/minecraft/shaders/*')
          cd src_mc
          sig() { for f in "$@"; do echo "##### SIG $f"; grep -nE '^\s*(public|protected|static|default|record|interface)\b.*[({;=]' "$f" | cut -c1-200 | head -${N:-40}; done; }
          sig net/minecraft/client/renderer/LightTexture.java com/mojang/blaze3d/systems/RenderPass.java net/minecraft/client/renderer/block/model/BakedQuad.java \
              net/minecraft/client/renderer/block/model/BlockStateModel.java net/minecraft/client/renderer/block/model/BlockModelPart.java \
              net/minecraft/client/renderer/texture/SpriteContents.java net/minecraft/client/renderer/texture/TextureAtlasSprite.java \
              net/minecraft/client/color/block/BlockColors.java com/mojang/blaze3d/textures/GpuSampler.java
          grep -nE 'lightTexture|LightTexture ' net/minecraft/client/renderer/GameRenderer.java | head -5
          grep -rnE 'getBlockModel\(|getModelManager|getBlockModelShaper' net/minecraft/client/renderer/block/BlockRenderDispatcher.java net/minecraft/client/Minecraft.java | head -8
          grep -rnE 'static .*(getSamplerCache|getSampler)|class SamplerCache' com/mojang/blaze3d/systems/RenderSystem.java | head
          grep -rnE 'public .*\(' com/mojang/blaze3d/systems/SamplerCache.java 2>/dev/null | head; ls com/mojang/blaze3d/systems/ com/mojang/blaze3d/textures/ | tr '\n' ' '
          echo; grep -rn -B2 -A6 'bindTexture("Sampler2"' net/minecraft/client/renderer | head -40
          for s in core/terrain.vsh core/terrain.fsh include/light.glsl; do echo "##### FILE $s"; cat -n assets/minecraft/shaders/$s | head -70; done
          grep -n -A12 'getSkyDarken\|float getSkyDarken' net/minecraft/client/multiplayer/ClientLevel.java | head -20
