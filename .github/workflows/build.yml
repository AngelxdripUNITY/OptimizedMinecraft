name: build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: OptimizedMinecraft
          path: build/libs/

  # Starts the real game (software OpenGL under a virtual display), creates a
  # world at render distance 40 and checks chunks arrive beyond vanilla's 32.
  client-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: client gametest
        run: |
          set -o pipefail
          ./gradlew runProductionClientGameTest --stacktrace 2>&1 | tee gametest.log
          grep -q "OPTIMIZEDMC GAMETEST PASSED" gametest.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test screenshots and logs
          path: |
            build/run/clientGameTest/screenshots
            build/run/clientGameTest/logs
            run/screenshots
            run/logs
            gametest.log
